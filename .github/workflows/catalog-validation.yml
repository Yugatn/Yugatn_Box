name: Catalog validation

on:
  push:
    branches: [main, feature/xr-support]
    paths:
      - 'data/**'
      - 'schemas/**'
      - 'scripts/validate-game-catalog.mjs'
      - 'tests/**'
      - '.github/workflows/catalog-validation.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'schemas/**'
      - 'scripts/validate-game-catalog.mjs'
      - 'tests/**'
      - '.github/workflows/catalog-validation.yml'

permissions:
  contents: read

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run catalog validator
        run: node scripts/validate-game-catalog.mjs
      - name: Run validator tests
        run: node --test tests/validate-game-catalog.test.mjs
