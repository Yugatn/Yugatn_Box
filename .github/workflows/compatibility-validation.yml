name: Compatibility data validation
on:
  push:
    paths:
      - "compatibility/**"
      - "shell/**"
      - ".github/workflows/compatibility-validation.yml"
  pull_request:
    paths:
      - "compatibility/**"
      - "shell/**"
      - ".github/workflows/compatibility-validation.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse catalog and schemas as JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('compatibility/game.schema.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('compatibility/report.schema.json','utf8'))"
          node -e "const c=JSON.parse(require('fs').readFileSync('compatibility/catalog.json','utf8')); if(c.schema_version!==1 || !Array.isArray(c.entries) || c.entries.length<1) process.exit(1); const ids=c.entries.map(x=>x.game_id); if(new Set(ids).size!==ids.length) process.exit(1); for(const g of c.entries){if(g.tested===false && g.status!=='Not tested') process.exit(1); if(['Native','Verified','Playable'].includes(g.status) && (!g.tested || !g.test_date)) process.exit(1);} console.log('Catalog structure OK; entries:',c.entries.length)"
      - name: Check shell files exist
        run: test -s shell/index.html && test -s shell/app.js && test -s shell/style.css
